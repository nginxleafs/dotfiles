
# ~/.tmux.conf — tmux 3.8+

# ── Prefix ────────────────────────────────────────────────────────────────────
# Secondary prefix kept as default C-b is unbound in favor of C-q (as before).
set -g prefix C-q
unbind-key C-b
bind-key C-q send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"          # truecolor where supported
set -ga terminal-overrides ",*256col*:Tc"

set -g mouse on
set -g history-limit 50000
set -s escape-time 0                        # no delay after Esc (important for Vim/Neovim)
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on                     # use terminal OSC52 when available

set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on                  # keep window numbers compact after closing
setw -g aggressive-resize on
setw -g mode-keys vi
set -g status-keys emacs

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Windows & panes ───────────────────────────────────────────────────────────
# Create new windows/panes in current working directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (repeatable)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Vim-style pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Disable arrow-key pane navigation
unbind Up
unbind Down
unbind Left
unbind Right

# Quick window switching
bind -r C-h previous-window
bind -r C-l next-window

# Toggle pane synchronization (type in all panes at once)
bind S setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# ── Status bar ────────────────────────────────────────────────────────────────
# Kept off by default (as before). Toggle with: prefix + b
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=default"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left " #[bold]#S#[nobold] "
set -g status-right " %H:%M  %d-%b "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[bold]#I:#W#[nobold] "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"
set -g message-style "bg=default,fg=yellow,bold"

# Toggle status bar visibility
bind b set-option status

# ── Activity ──────────────────────────────────────────────────────────────────
setw -g monitor-activity off
set -g visual-activity off

# ── Plugins (TPM) ─────────────────────────────────────────────────────────────
# prefix + I — install plugins, prefix + U — update, prefix + alt+u — uninstall removed
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum: auto-save only; restore manually with prefix + Ctrl-r (tmux-resurrect)
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
